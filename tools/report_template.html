<title>Билеты в Гоа</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column of ticket cards. Every leg is a bar on a shared scale (full width = longest leg),
   flights solid, layovers hatched, so options compare at a glance. Airport codes and times use a
   departure-board mono face. */
:root {
  --bg: #f5f4f0;
  --card: #fcfcfb;
  --ink: #0b0b0b;
  --ink2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --baseline: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --flight: #2a78d6;
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --warn: #fab219;
  --chip: #eceae4;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --card: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --baseline: #383835; --border: rgba(255, 255, 255, 0.10);
    --flight: #3987e5; --accent: #3987e5; --accent-ink: #0b0b0b; --warn: #fab219; --chip: #262624;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121211; --card: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --baseline: #383835; --border: rgba(255, 255, 255, 0.10);
  --flight: #3987e5; --accent: #3987e5; --accent-ink: #0b0b0b; --warn: #fab219; --chip: #262624;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45;
  padding-block: 20px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.mono { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
h1 { font-size: 30px; line-height: 1.1; font-weight: 600; margin: 4px 0 6px; text-wrap: balance; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2); margin: 0; }
.sub { margin: 0; color: var(--ink2); }
.fresh { margin: 10px 0 0; padding: 8px 10px; border-left: 3px solid var(--warn); background: var(--card); border-radius: 0 6px 6px 0; font-size: 13px; color: var(--ink2); }

.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.seg-ctl { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--card); }
.seg-ctl button { font: inherit; font-size: 13px; padding: 7px 11px; border: 0; background: transparent; color: var(--ink2); cursor: pointer; }
.seg-ctl button + button { border-left: 1px solid var(--border); }
.seg-ctl button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
details.filters { font-size: 13px; color: var(--ink2); }
details.filters > summary { cursor: pointer; list-style: none; padding: 7px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); display: inline-block; }
details.filters > summary::-webkit-details-marker { display: none; }
details.filters[open] > summary { border-color: var(--accent); }
.fbody { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 10px; }
.fbody label { display: inline-flex; gap: 6px; align-items: center; }
.controls details.filters[open] { flex-basis: 100%; }
select { font: inherit; font-size: 13px; color: var(--ink); background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 5px 6px; max-width: 100%; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible, .seg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink2); align-items: center; }
.sw { display: inline-block; width: 22px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.sw.flight { background: var(--flight); }
.sw.lay { background: repeating-linear-gradient(135deg, var(--baseline) 0 3px, transparent 3px 6px); border: 1px solid var(--baseline); }

.list { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.card[data-sel="true"] { outline: 2px solid var(--accent); }
.head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; justify-content: space-between; }
.price { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.per { font-size: 13px; color: var(--ink2); }
.dates { font-size: 13px; color: var(--ink2); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--ink); border: 1px solid var(--border); }
.tag.good { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.tag.warn::before { content: ""; display: inline-block; width: 8px; height: 8px; background: var(--warn); border-radius: 2px; margin-right: 6px; }

.leg { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.leg-h { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.leg-l { font-weight: 600; }
.leg-t { color: var(--ink2); font-variant-numeric: tabular-nums; }
.track { border-bottom: 1px solid var(--baseline); padding-bottom: 3px; }
.bar { display: flex; gap: 2px; height: 14px; }
.seg { flex-basis: 0; min-width: 3px; border-radius: 2px; cursor: default; }
.seg:first-child { border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
.seg:last-child { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
.seg.flight { background: var(--flight); }
.seg.lay { background: repeating-linear-gradient(135deg, var(--baseline) 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1px var(--baseline); }
.route { font-size: 12px; color: var(--ink2); overflow-wrap: anywhere; }
.lays { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 1px 7px; border-radius: 4px; background: var(--chip); color: var(--ink2); border: 1px solid var(--border); }
.chip.hl { color: var(--ink); border-color: var(--baseline); }

.foot { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; border-top: 1px solid var(--grid); padding-top: 10px; }
.pick { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink2); }
.buy { display: flex; flex-wrap: wrap; gap: 6px; }
.buy a { font-size: 13px; text-decoration: none; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--accent); color: var(--ink); }
.buy a:first-child { background: var(--accent); color: var(--accent-ink); }
.nolink { font-size: 12px; color: var(--muted); }

.tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-weight: 600; color: var(--ink2); font-size: 12px; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.best, .cmp td.best { font-weight: 600; }
td.best::before, .cmp td.best::before { content: ""; display: inline-block; width: 7px; height: 7px; background: var(--accent); border-radius: 50%; margin-right: 6px; }

.cmp-sec { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.cmp-sec h2 { font-size: 18px; margin: 0 0 10px; }
table.cmp { min-width: 0; }
.cmp th, .cmp td { padding: 8px; }
.cmp td { min-width: 116px; }
.cmp th.rowh { color: var(--ink2); font-weight: 500; white-space: normal; min-width: 78px; font-size: 12px; }
.cmp-note { font-size: 12px; color: var(--ink2); margin: 8px 0 0; }

.tray { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; gap: 10px; align-items: center; justify-content: space-between;
  background: var(--card); border-top: 1px solid var(--border);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tray button { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.tray button.ghost { background: transparent; color: var(--ink); border-color: var(--border); }
.tray .btns { display: flex; gap: 8px; }

.notes { font-size: 12px; color: var(--ink2); display: flex; flex-direction: column; gap: 4px; }
.notes p { margin: 0; }
.empty { padding: 24px; text-align: center; color: var(--ink2); background: var(--card); border: 1px dashed var(--baseline); border-radius: 10px; }

#tip { position: fixed; z-index: 10; pointer-events: none; max-width: min(280px, calc(100vw - 24px)); padding: 6px 9px; border-radius: 6px; font-size: 12px; line-height: 1.35;
  background: var(--ink); color: var(--bg); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25); }
@media (prefers-reduced-motion: no-preference) { .card { transition: outline-color 0.15s; } }
</style>

<main class="wrap">
  <header>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
    <p class="fresh" id="fresh"></p>
  </header>

  <section class="controls" aria-label="Сортировка и фильтры">
    <div class="seg-ctl" role="group" aria-label="Сортировка" id="sortCtl">
      <button type="button" data-sort="price" aria-pressed="true">Цена</button>
      <button type="button" data-sort="time" aria-pressed="false">Время в пути</button>
      <button type="button" data-sort="stops" aria-pressed="false">Пересадки</button>
    </div>
    <div class="seg-ctl" role="group" aria-label="Вид" id="viewCtl">
      <button type="button" data-view="cards" aria-pressed="true">Карточки</button>
      <button type="button" data-view="table" aria-pressed="false">Таблица</button>
    </div>
    <details class="filters" id="filters">
      <summary>Фильтры</summary>
      <div class="fbody">
        <label for="fStops">Пересадок не больше
          <select id="fStops"><option value="9">любое число</option><option value="1">1 на плече</option><option value="2">2 на плече</option></select></label>
        <label for="fDates">Даты <select id="fDates"></select></label>
        <label for="fAirport" id="airportLabel">Аэропорт <select id="fAirport"></select></label>
        <label for="fOne"><input type="checkbox" id="fOne"> Только один билет</label>
      </div>
    </details>
  </section>

  <div class="legend" aria-label="Обозначения">
    <span><i class="sw flight"></i>перелёт</span>
    <span><i class="sw lay"></i>пересадка</span>
    <span id="scaleNote"></span>
  </div>

  <section class="list" id="list" aria-live="polite"></section>
  <section class="cmp-sec" id="cmpSec" hidden>
    <h2>Сравнение</h2>
    <div class="tablewrap"><table class="cmp" id="cmpTable"></table></div>
    <p class="cmp-note">Точка у значения отмечает лучший показатель в строке.</p>
  </section>

  <section class="notes" id="notes"></section>
</main>

<div class="tray" id="tray" hidden>
  <span id="trayText"></span>
  <span class="btns"><button type="button" class="ghost" id="trayClear">Сбросить</button><button type="button" id="trayGo">Сравнить</button></span>
</div>
<div id="tip" hidden></div>

<script type="application/json" id="data">__DATA__</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('data').textContent);
  var CUR = { EUR: '€', USD: '$', RUB: '₽', INR: '₹' }[D.currency] || D.currency;
  var MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  var NB = ' ';
  var state = { sort: 'price', view: 'cards', maxStops: 9, dates: 'all', airport: 'all', one: false, sel: [] };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { return Math.round(n).toLocaleString('ru-RU') + NB + CUR; }
  function dur(m) { var h = Math.floor(m / 60), mm = m % 60; return h + 'ч' + (mm ? NB + String(mm).padStart(2, '0') + 'м' : ''); }
  function hm(s) { return s.slice(11, 16); }
  function dm(s) { return +s.slice(8, 10) + NB + MONTHS[+s.slice(5, 7) - 1]; }
  function dayDiff(a, b) { return Math.round((Date.parse(b.slice(0, 10)) - Date.parse(a.slice(0, 10))) / 86400000); }
  function plus(a, b) { var d = dayDiff(a, b); return d > 0 ? ' +' + d : ''; }
  function hour(s) { return +s.slice(11, 13); }

  var items = D.items.map(function (it) {
    var out = it.outbound, ret = it.inbound;
    var lastOut = out.segments[out.segments.length - 1];
    return {
      id: it.id, price: it.price, per: it.price / D.passengers, out: out, ret: ret, self: it.self, bags: it.bags, links: it.links || [],
      outDate: out.segments[0].dep.slice(0, 10), retDate: ret.segments[0].dep.slice(0, 10),
      airport: lastOut.to, carrier: [out.carrier, ret.carrier].filter(function (x, i, a) { return x && a.indexOf(x) === i; }).join(' / '),
      stops: Math.max(out.segments.length, ret.segments.length) - 1,
      totalStops: out.segments.length + ret.segments.length - 2,
      time: out.minutes + ret.minutes,
      arrDest: lastOut.arr, depDest: ret.segments[0].dep, outDep: out.segments[0].dep
    };
  });
  var maxLeg = Math.max.apply(null, items.map(function (i) { return Math.max(i.out.minutes, i.ret.minutes); }));
  var minPrice = Math.min.apply(null, items.map(function (i) { return i.price; }));
  var minTime = Math.min.apply(null, items.map(function (i) { return i.time; }));

  function layType(l, self) {
    if (l.min < 120) return { cls: '', text: 'короткая' + (self ? ', отдельные билеты' : '') };
    if (l.night >= 240) return { cls: 'hl', text: 'ночёвка' };
    if (l.min >= 360) return { cls: 'hl', text: l.min >= 1200 ? 'почти сутки' : 'день в городе' };
    return { cls: '', text: '' };
  }
  function tipFlight(s) { return s.flight + (s.airline ? ' · ' + s.airline : '') + ' · ' + s.from + ' ' + hm(s.dep) + ' → ' + s.to + ' ' + hm(s.arr) + ' · ' + dur(s.min); }
  function tipLay(l) { return 'Пересадка ' + l.airport + ' · ' + dur(l.min) + ' · местное время ' + dm(l.from) + ' ' + hm(l.from) + ' → ' + dm(l.to) + ' ' + hm(l.to) + (l.night >= 60 ? ' · ночью ' + dur(l.night) : ''); }

  function legHTML(label, leg, it) {
    var parts = [], route = [], chips = [];
    leg.segments.forEach(function (s, i) {
      var t = tipFlight(s);
      parts.push('<span class="seg flight" style="flex-grow:' + s.min + '" tabindex="0" role="img" data-tip="' + esc(t) + '" aria-label="' + esc(t) + '"></span>');
      route.push(s.from + ' ' + hm(s.dep) + ' → ' + s.to + ' ' + hm(s.arr) + plus(leg.segments[0].dep, s.arr));
      var l = leg.layovers[i];
      if (l) {
        var lt = tipLay(l), ty = layType(l, it.self);
        parts.push('<span class="seg lay" style="flex-grow:' + l.min + '" tabindex="0" role="img" data-tip="' + esc(lt) + '" aria-label="' + esc(lt) + '"></span>');
        chips.push('<span class="chip ' + ty.cls + '" title="' + esc(lt) + '">' + esc(l.airport) + ' · ' + dur(l.min) + (ty.text ? ' · ' + esc(ty.text) : '') + '</span>');
      }
    });
    var w = leg.minutes / maxLeg * 100;
    return '<div class="leg"><div class="leg-h"><span class="leg-l">' + label + '</span><span class="leg-t">' + dur(leg.minutes) + ' · ' +
      (leg.segments.length === 1 ? 'без пересадок' : (leg.segments.length - 1) + (leg.segments.length === 2 ? ' пересадка' : ' пересадки')) + '</span></div>' +
      '<div class="track"><div class="bar" style="width:' + w.toFixed(2) + '%">' + parts.join('') + '</div></div>' +
      '<div class="route mono">' + esc(route.join('  ·  ')) + '</div>' +
      (chips.length ? '<div class="lays">' + chips.join('') + '</div>' : '') + '</div>';
  }

  function tagsFor(it) {
    var t = [];
    if (it.price === minPrice) t.push('<span class="tag good">Самый дешёвый</span>');
    if (it.time === minTime) t.push('<span class="tag good">Самый быстрый</span>');
    if (it.self === true) t.push('<span class="tag warn">Отдельные билеты: при опоздании второй рейс пропадёт</span>');
    var ah = hour(it.arrDest), dh = hour(it.depDest);
    if (ah < 6) t.push('<span class="tag warn">Прилёт ночью, ' + hm(it.arrDest) + '</span>');
    if (dh < 6) t.push('<span class="tag warn">Вылет обратно ночью, ' + hm(it.depDest) + '</span>');
    return t.join('');
  }

  function buyHTML(it) {
    if (!it.links.length) return '<span class="nolink">Ссылку на покупку можно получить по запросу</span>';
    var ls = it.links.slice().sort(function (a, b) { return (a.price || 1e12) - (b.price || 1e12); });
    return ls.map(function (l) {
      return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer">' + esc(l.provider) + (l.price ? ' · ' + money(l.price) : '') + '</a>';
    }).join('');
  }

  function cardHTML(it) {
    var sel = state.sel.indexOf(it.id) >= 0;
    return '<article class="card" data-id="' + it.id + '" data-sel="' + sel + '">' +
      '<div class="head"><div><div class="price">' + money(it.price) + '</div><div class="per">≈ ' + money(it.per) + ' на человека · ' + esc(it.carrier) + '</div></div>' +
      '<div class="dates mono">' + dm(it.outDate) + ' → ' + dm(it.retDate) + ' · ' + it.airport + '</div></div>' +
      '<div class="tags">' + tagsFor(it) + '</div>' +
      legHTML('Туда', it.out, it) + legHTML('Обратно', it.ret, it) +
      '<div class="foot"><label class="pick"><input type="checkbox" data-pick="' + it.id + '"' + (sel ? ' checked' : '') + '> Сравнить</label><div class="buy">' + buyHTML(it) + '</div></div></article>';
  }

  function layoverSummary(leg) {
    if (!leg.layovers.length) return 'без пересадок';
    return leg.layovers.map(function (l) { return l.airport + ' ' + dur(l.min); }).join(', ');
  }
  function tableHTML(list) {
    var rows = list.map(function (it) {
      var sel = state.sel.indexOf(it.id) >= 0;
      return '<tr><td><input type="checkbox" data-pick="' + it.id + '"' + (sel ? ' checked' : '') + ' aria-label="Сравнить"></td>' +
        '<td' + (it.price === minPrice ? ' class="best"' : '') + '>' + money(it.price) + '</td>' +
        '<td>' + dm(it.outDate) + ' → ' + dm(it.retDate) + '<br><span class="per">' + it.airport + ' · ' + esc(it.carrier) + '</span></td>' +
        '<td' + (it.out.minutes === Math.min.apply(null, list.map(function (x) { return x.out.minutes; })) ? ' class="best"' : '') + '>' + dur(it.out.minutes) + '<br><span class="per">' + esc(layoverSummary(it.out)) + '</span></td>' +
        '<td' + (it.ret.minutes === Math.min.apply(null, list.map(function (x) { return x.ret.minutes; })) ? ' class="best"' : '') + '>' + dur(it.ret.minutes) + '<br><span class="per">' + esc(layoverSummary(it.ret)) + '</span></td>' +
        '<td>' + (it.self === true ? 'отдельные' : it.self === false ? 'один билет' : 'нет данных') + '</td></tr>';
    }).join('');
    return '<div class="tablewrap"><table><thead><tr><th></th><th>Цена за всех</th><th>Даты</th><th>Туда: в пути, пересадки</th><th>Обратно: в пути, пересадки</th><th>Билет</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function filtered() {
    var list = items.filter(function (it) {
      return it.stops <= state.maxStops && (state.dates === 'all' || (it.outDate + '|' + it.retDate) === state.dates) &&
        (state.airport === 'all' || it.airport === state.airport) && (!state.one || it.self !== true);
    });
    var by = { price: function (a, b) { return a.price - b.price; }, time: function (a, b) { return a.time - b.time || a.price - b.price; },
      stops: function (a, b) { return a.totalStops - b.totalStops || a.price - b.price; } }[state.sort];
    return list.sort(by);
  }

  function renderCompare() {
    var sec = document.getElementById('cmpSec');
    var picked = state.sel.map(function (id) { return items.filter(function (i) { return i.id === id; })[0]; }).filter(Boolean);
    if (picked.length < 2 || !state.showCmp) { sec.hidden = true; return; }
    function min(fn) { return Math.min.apply(null, picked.map(fn)); }
    var rows = [
      ['Цена за всех', function (i) { return money(i.price); }, function (i) { return i.price; }],
      ['На человека', function (i) { return money(i.per); }, function (i) { return i.per; }],
      ['Даты', function (i) { return dm(i.outDate) + ' → ' + dm(i.retDate); }],
      ['Туда: в пути', function (i) { return dur(i.out.minutes); }, function (i) { return i.out.minutes; }],
      ['Туда: пересадки', function (i) { return layoverSummary(i.out); }],
      ['Прилёт в Гоа', function (i) { return dm(i.arrDest) + ' ' + hm(i.arrDest); }],
      ['Обратно: в пути', function (i) { return dur(i.ret.minutes); }, function (i) { return i.ret.minutes; }],
      ['Обратно: пересадки', function (i) { return layoverSummary(i.ret); }],
      ['Вылет из Гоа', function (i) { return dm(i.depDest) + ' ' + hm(i.depDest); }],
      ['Билет', function (i) { return i.self === true ? 'отдельные билеты' : i.self === false ? 'один билет' : 'нет данных'; }],
      ['Багаж', function (i) { return i.bags ? 'ручная кладь: ' + (i.bags.carry_on == null ? 'нет данных' : i.bags.carry_on) + ', багаж: ' + (i.bags.checked == null ? 'нет данных' : i.bags.checked) : 'нет данных'; }],
      ['Где купить', function (i) { return i.links.length ? esc(i.links.map(function (l) { return l.provider; }).join(', ')) : 'по запросу'; }]
    ];
    var head = '<tr><th></th>' + picked.map(function (i) { return '<th>' + esc(i.carrier) + '<br><span class="per">' + dm(i.outDate) + ' → ' + dm(i.retDate) + '</span></th>'; }).join('') + '</tr>';
    var body = rows.map(function (r) {
      var best = r[2] ? min(r[2]) : null, uniq = r[2] ? picked.filter(function (i) { return r[2](i) === best; }).length < picked.length : false;
      return '<tr><th class="rowh" scope="row">' + r[0] + '</th>' + picked.map(function (i) {
        return '<td' + (uniq && r[2](i) === best ? ' class="best"' : '') + '>' + (r[0] === 'Где купить' ? r[1](i) : esc(r[1](i))) + '</td>';
      }).join('') + '</tr>';
    }).join('');
    document.getElementById('cmpTable').innerHTML = '<thead>' + head + '</thead><tbody>' + body + '</tbody>';
    sec.hidden = false;
  }

  function renderTray() {
    var tray = document.getElementById('tray'), n = state.sel.length;
    tray.hidden = n === 0;
    document.getElementById('trayText').textContent = n < 2 ? 'Выбрано: ' + n + '. Отметьте ещё один вариант' : 'Выбрано: ' + n + ' из 3';
    document.getElementById('trayGo').disabled = n < 2;
    document.getElementById('trayGo').style.opacity = n < 2 ? 0.5 : 1;
  }

  function render() {
    var list = filtered(), el = document.getElementById('list');
    el.innerHTML = list.length ? (state.view === 'cards' ? list.map(cardHTML).join('') : tableHTML(list)) : '<div class="empty">Нет вариантов под выбранные фильтры. Ослабьте один из них.</div>';
    renderCompare(); renderTray();
  }

  function init() {
    document.getElementById('eyebrow').textContent = D.eyebrow;
    document.getElementById('title').textContent = D.title;
    document.getElementById('subtitle').textContent = D.subtitle;
    var when = new Date(D.observed_at);
    document.getElementById('fresh').textContent = 'Цены живые на ' + when.toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) +
      '. Билеты быстро дорожают и пропадают: лучший вариант часа назад мог исчезнуть. Перед покупкой проверьте цену по ссылке.';
    document.getElementById('scaleNote').textContent = 'Все полосы в одном масштабе: полная ширина = ' + dur(maxLeg) + ' в пути';
    var pairs = {}, airports = {};
    items.forEach(function (i) { pairs[i.outDate + '|' + i.retDate] = 1; airports[i.airport] = 1; });
    var dsel = document.getElementById('fDates');
    dsel.innerHTML = '<option value="all">все</option>' + Object.keys(pairs).sort().map(function (p) { var a = p.split('|'); return '<option value="' + p + '">' + dm(a[0]) + ' → ' + dm(a[1]) + '</option>'; }).join('');
    var asel = document.getElementById('fAirport'), ak = Object.keys(airports).sort();
    asel.innerHTML = '<option value="all">все</option>' + ak.map(function (a) { return '<option>' + a + '</option>'; }).join('');
    if (ak.length < 2) document.getElementById('airportLabel').hidden = true;
    if (window.matchMedia && window.matchMedia('(min-width: 720px)').matches) document.getElementById('filters').open = true;
    var notes = D.notes || [];
    document.getElementById('notes').innerHTML = notes.map(function (n) { return '<p>' + esc(n) + '</p>'; }).join('');

    document.getElementById('sortCtl').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return; state.sort = b.dataset.sort;
      [].forEach.call(this.children, function (c) { c.setAttribute('aria-pressed', c === b); }); render();
    });
    document.getElementById('viewCtl').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return; state.view = b.dataset.view;
      [].forEach.call(this.children, function (c) { c.setAttribute('aria-pressed', c === b); }); render();
    });
    document.getElementById('fStops').addEventListener('change', function () { state.maxStops = +this.value; render(); });
    dsel.addEventListener('change', function () { state.dates = this.value; render(); });
    asel.addEventListener('change', function () { state.airport = this.value; render(); });
    document.getElementById('fOne').addEventListener('change', function () { state.one = this.checked; render(); });
    document.getElementById('list').addEventListener('change', function (e) {
      var id = e.target.dataset && e.target.dataset.pick; if (!id) return;
      var i = state.sel.indexOf(id);
      if (e.target.checked && i < 0) { state.sel.push(id); if (state.sel.length > 3) state.sel.shift(); }
      if (!e.target.checked && i >= 0) state.sel.splice(i, 1);
      state.showCmp = state.sel.length >= 2 && state.showCmp; render();
    });
    document.getElementById('trayGo').addEventListener('click', function () {
      state.showCmp = true; render(); document.getElementById('cmpSec').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    document.getElementById('trayClear').addEventListener('click', function () { state.sel = []; state.showCmp = false; render(); });

    var tip = document.getElementById('tip');
    function show(t) {
      var r = t.getBoundingClientRect(); tip.textContent = t.dataset.tip; tip.hidden = false;
      var w = tip.offsetWidth, x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8);
      var y = r.top - tip.offsetHeight - 8; if (y < 8) y = r.bottom + 8;
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    }
    document.addEventListener('pointerover', function (e) { var t = e.target.closest('[data-tip]'); if (t) show(t); });
    document.addEventListener('pointerout', function (e) { if (e.target.closest('[data-tip]')) tip.hidden = true; });
    document.addEventListener('focusin', function (e) { var t = e.target.closest('[data-tip]'); if (t) show(t); });
    document.addEventListener('focusout', function () { tip.hidden = true; });
    document.addEventListener('click', function (e) { var t = e.target.closest('[data-tip]'); if (t) show(t); else tip.hidden = true; });
    window.addEventListener('scroll', function () { tip.hidden = true; }, { passive: true });
    render();
  }
  init();
})();
</script>
